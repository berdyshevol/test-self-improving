name: RSI check

on:
  push:
  pull_request:

jobs:
  verify-rsi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify RSI invariants and Markdown links
        run: node scripts/verify-rsi.js
